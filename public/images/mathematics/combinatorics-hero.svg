<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#030712"/>
  <rect width="960" height="540" fill="url(#bgGlow)"/>

  <!-- Coordinate Grid Lines -->
  <g opacity="0.15" stroke="#d97706" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="540"/>
    <line x1="64" y1="0" x2="64" y2="540"/>
    <line x1="128" y1="0" x2="128" y2="540"/>
    <line x1="192" y1="0" x2="192" y2="540"/>
    <line x1="256" y1="0" x2="256" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="540"/>
    <line x1="384" y1="0" x2="384" y2="540"/>
    <line x1="448" y1="0" x2="448" y2="540"/>
    <line x1="512" y1="0" x2="512" y2="540"/>
    <line x1="576" y1="0" x2="576" y2="540"/>
    <line x1="640" y1="0" x2="640" y2="540"/>
    <line x1="704" y1="0" x2="704" y2="540"/>
    <line x1="768" y1="0" x2="768" y2="540"/>
    <line x1="832" y1="0" x2="832" y2="540"/>
    <line x1="896" y1="0" x2="896" y2="540"/>
    <line x1="960" y1="0" x2="960" y2="540"/>
    <line x1="0" y1="0" x2="960" y2="0"/>
    <line x1="0" y1="60" x2="960" y2="60"/>
    <line x1="0" y1="120" x2="960" y2="120"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="240" x2="960" y2="240"/>
    <line x1="0" y1="300" x2="960" y2="300"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="420" x2="960" y2="420"/>
    <line x1="0" y1="480" x2="960" y2="480"/>
    <line x1="0" y1="540" x2="960" y2="540"/>
  </g>

  <!-- Central Scientific Diagram Vector Art -->
  <g transform="translate(480, 260)">
    
      <!-- Pascal Triangle Pyramids -->
      <text x="0" y="-60" fill="#f59e0b" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle">1</text>
      <text x="-30" y="-25" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">1</text>
      <text x="30" y="-25" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">1</text>
      <text x="-60" y="10" fill="#c084fc" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">1</text>
      <text x="0" y="10" fill="#f43f5e" font-family="monospace" font-size="20" font-weight="black" text-anchor="middle">2</text>
      <text x="60" y="10" fill="#c084fc" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">1</text>
      <text x="-90" y="45" fill="#10b981" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">1</text>
      <text x="-30" y="45" fill="#f59e0b" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle">3</text>
      <text x="30" y="45" fill="#f59e0b" font-family="monospace" font-size="18" font-weight="bold" text-anchor="middle">3</text>
      <text x="90" y="45" fill="#10b981" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">1</text>
    
  </g>

  <!-- Title & Kicker Badge Card Overlay -->
  <g transform="translate(48, 48)">
    <!-- Glassmorphic Banner -->
    <rect width="460" height="130" rx="16" fill="url(#cardGrad)" stroke="#d97706" stroke-opacity="0.3" stroke-width="1.5"/>
    
    <!-- Subject & Level Tags -->
    <g transform="translate(20, 28)">
      
        <g transform="translate(0, 0)">
          <rect width="100" height="24" rx="12" fill="#d97706" fill-opacity="0.2" stroke="#d97706" stroke-opacity="0.5"/>
          <text x="50" y="16" fill="#d97706" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Mathematics</text>
        </g>
      
        <g transform="translate(110, 0)">
          <rect width="100" height="24" rx="12" fill="#d97706" fill-opacity="0.2" stroke="#d97706" stroke-opacity="0.5"/>
          <text x="50" y="16" fill="#d97706" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Combinatorics</text>
        </g>
      
        <g transform="translate(220, 0)">
          <rect width="100" height="24" rx="12" fill="#d97706" fill-opacity="0.2" stroke="#d97706" stroke-opacity="0.5"/>
          <text x="50" y="16" fill="#d97706" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Discrete Math</text>
        </g>
      
    </g>

    <!-- Main Title -->
    <text x="20" y="80" fill="#f9fafb" font-family="'Space Grotesk', Inter, system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="-0.02em">
      Combinatorics &amp; Pascal's Triangle
    </text>

    <!-- Formula / Subtitle -->
    <text x="20" y="106" fill="#f59e0b" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="bold">
      C(n, k) = n! / (k!(n-k)!) • (x+y)^n = Σ C(n,k) x^(n-k) y^k
    </text>
  </g>

  <!-- Bottom Telemetry Metric Strip -->
  <g transform="translate(48, 460)">
    <rect width="864" height="48" rx="12" fill="#111827" fill-opacity="0.85" stroke="rgba(255,255,255,0.1)"/>
    <text x="24" y="30" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="12">
      Permutations, Combinations &amp; Binomial Expansion Theorem
    </text>
    <text x="840" y="30" fill="#d97706" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="bold" text-anchor="end">
      OpenLabs STEM Suite • Real-time Numeric Solver
    </text>
  </g>
</svg>