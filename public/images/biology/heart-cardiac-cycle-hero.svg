<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#e11d48" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="#030712"/>
  <rect width="960" height="540" fill="url(#bgGlow)"/>

  <!-- Coordinate Grid Lines -->
  <g opacity="0.15" stroke="#e11d48" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="540"/>
    <line x1="64" y1="0" x2="64" y2="540"/>
    <line x1="128" y1="0" x2="128" y2="540"/>
    <line x1="192" y1="0" x2="192" y2="540"/>
    <line x1="256" y1="0" x2="256" y2="540"/>
    <line x1="320" y1="0" x2="320" y2="540"/>
    <line x1="384" y1="0" x2="384" y2="540"/>
    <line x1="448" y1="0" x2="448" y2="540"/>
    <line x1="512" y1="0" x2="512" y2="540"/>
    <line x1="576" y1="0" x2="576" y2="540"/>
    <line x1="640" y1="0" x2="640" y2="540"/>
    <line x1="704" y1="0" x2="704" y2="540"/>
    <line x1="768" y1="0" x2="768" y2="540"/>
    <line x1="832" y1="0" x2="832" y2="540"/>
    <line x1="896" y1="0" x2="896" y2="540"/>
    <line x1="960" y1="0" x2="960" y2="540"/>
    <line x1="0" y1="0" x2="960" y2="0"/>
    <line x1="0" y1="60" x2="960" y2="60"/>
    <line x1="0" y1="120" x2="960" y2="120"/>
    <line x1="0" y1="180" x2="960" y2="180"/>
    <line x1="0" y1="240" x2="960" y2="240"/>
    <line x1="0" y1="300" x2="960" y2="300"/>
    <line x1="0" y1="360" x2="960" y2="360"/>
    <line x1="0" y1="420" x2="960" y2="420"/>
    <line x1="0" y1="480" x2="960" y2="480"/>
    <line x1="0" y1="540" x2="960" y2="540"/>
  </g>

  <!-- Central Scientific Diagram Vector Art -->
  <g transform="translate(480, 260)">
    
      <!-- 4-Chamber Heart Outline -->
      <path d="M 0 -80 C 40 -110, 90 -60, 80 20 C 70 80, 10 110, 0 120 C -10 110, -70 80, -80 20 C -90 -60, -40 -110, 0 -80 Z" fill="#881337" fill-opacity="0.8" stroke="#f43f5e" stroke-width="4" filter="url(#glow)"/>
      <!-- Right Atrium & Ventricle (Deox Blue) -->
      <path d="M -60 -40 C -60 -10, -40 0, -10 0 L -10 -40 Z" fill="#1e40af" fill-opacity="0.85"/>
      <path d="M -60 10 C -60 60, -30 90, -10 100 L -10 10 Z" fill="#1d4ed8" fill-opacity="0.85"/>
      <!-- Left Atrium & Ventricle (Ox Red) -->
      <path d="M 10 -40 L 10 0 C 40 0, 60 -10, 60 -40 Z" fill="#991b1b" fill-opacity="0.85"/>
      <path d="M 10 10 L 10 100 C 30 90, 60 60, 60 10 Z" fill="#b91c1c" fill-opacity="0.85"/>
      <!-- ECG Wave Trace Overlaid -->
      <path d="M -160 30 L -120 30 L -110 15 L -100 30 L -90 30 L -80 45 L -65 -60 L -50 50 L -40 30 L 10 30 Q 35 -10 60 30 L 160 30" fill="none" stroke="#10b981" stroke-width="3.5" filter="url(#glow)"/>
      <text x="0" y="145" fill="#facc15" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Lead II ECG • 72 BPM</text>
    
  </g>

  <!-- Title & Kicker Badge Card Overlay -->
  <g transform="translate(48, 48)">
    <!-- Glassmorphic Banner -->
    <rect width="460" height="130" rx="16" fill="url(#cardGrad)" stroke="#e11d48" stroke-opacity="0.3" stroke-width="1.5"/>
    
    <!-- Subject & Level Tags -->
    <g transform="translate(20, 28)">
      
        <g transform="translate(0, 0)">
          <rect width="100" height="24" rx="12" fill="#e11d48" fill-opacity="0.2" stroke="#e11d48" stroke-opacity="0.5"/>
          <text x="50" y="16" fill="#e11d48" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Biology</text>
        </g>
      
        <g transform="translate(110, 0)">
          <rect width="100" height="24" rx="12" fill="#e11d48" fill-opacity="0.2" stroke="#e11d48" stroke-opacity="0.5"/>
          <text x="50" y="16" fill="#e11d48" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Physiology</text>
        </g>
      
        <g transform="translate(220, 0)">
          <rect width="100" height="24" rx="12" fill="#e11d48" fill-opacity="0.2" stroke="#e11d48" stroke-opacity="0.5"/>
          <text x="50" y="16" fill="#e11d48" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Cardiology</text>
        </g>
      
    </g>

    <!-- Main Title -->
    <text x="20" y="80" fill="#f9fafb" font-family="'Space Grotesk', Inter, system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="-0.02em">
      Cardiac Cycle, ECG &amp; Heart Hemodynamics
    </text>

    <!-- Formula / Subtitle -->
    <text x="20" y="106" fill="#f59e0b" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="bold">
      CO = HR × SV • EF = (SV / EDV) × 100%
    </text>
  </g>

  <!-- Bottom Telemetry Metric Strip -->
  <g transform="translate(48, 460)">
    <rect width="864" height="48" rx="12" fill="#111827" fill-opacity="0.85" stroke="rgba(255,255,255,0.1)"/>
    <text x="24" y="30" fill="#9ca3af" font-family="Inter, system-ui, sans-serif" font-size="12">
      4-Chamber Pump, Lead II ECG, Wiggers Diagram &amp; S1/S2 Auscultation
    </text>
    <text x="840" y="30" fill="#e11d48" font-family="'IBM Plex Mono', monospace" font-size="12" font-weight="bold" text-anchor="end">
      OpenLabs STEM Suite • Real-time Numeric Solver
    </text>
  </g>
</svg>